name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install 7-Zip (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          # Prefer official 7zz when available for closer parity with local benches
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/7z.tar.xz "https://www.7-zip.org/a/7z2501-linux-x64.tar.xz"
          tar -xOf /tmp/7z.tar.xz 7zz > "$HOME/.local/bin/7zz"
          chmod +x "$HOME/.local/bin/7zz"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          7zz | head -2 || 7z | head -2

      - name: Install 7-Zip (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install p7zip || true
          # p7zip provides 7z/7za
          which 7z || which 7za
          7z | head -2 || 7za | head -2

      - name: Check
        run: cargo check --all-targets

      # GNU (Ubuntu) and BSD (macOS) userland differ. Do not use `touch -d @epoch`
      # or `date -d` in tests; use tests/common::set_mtime (std::fs).
      - name: Test
        run: cargo test --all-targets -- --nocapture

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Smoke CLI
        run: |
          ./target/release/archiveconverter backend
          ./target/release/archiveconverter list-converters
          ./target/release/bench_nested scales

  bench-compare:
    name: CLI comparison bench (ubuntu)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install 7-Zip
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/7z.tar.xz "https://www.7-zip.org/a/7z2501-linux-x64.tar.xz"
          tar -xOf /tmp/7z.tar.xz 7zz > "$HOME/.local/bin/7zz"
          ln -sfn "$HOME/.local/bin/7zz" "$HOME/.local/bin/7z"
          chmod +x "$HOME/.local/bin/7zz"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run comparison tests
        run: cargo test --test compare_7z_cli -- --nocapture

      - name: Quick nested bench
        run: |
          cargo build --release --bin archiveconverter --bin bench_nested
          ./target/release/bench_nested all --scale tiny --threads 1,2 --force
          cat benchdata/tiny/results/results.md

  # Optional multi-minute tool vs manual 7z (fair one-at-a-time). Not on every PR.
  large-compare:
    name: Large CLI comparison (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install 7zz
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/7z.tar.xz "https://www.7-zip.org/a/7z2501-linux-x64.tar.xz"
          tar -xOf /tmp/7z.tar.xz 7zz > "$HOME/.local/bin/7zz"
          chmod +x "$HOME/.local/bin/7zz"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run large comparison
        env:
          LARGE_BENCH_FILES: "200000"
          LARGE_BENCH_NESTED: "3"
          LARGE_BENCH_MIN_SECS: "90"
        run: |
          cargo test --release --test compare_7z_cli large_tool_vs_manual \
            -- --ignored --nocapture
